<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sombra suave para dar volumen -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#001229" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Cuerpo del Punto de Venta (Azul Farmatodo) -->
  <rect x="96" y="48" width="320" height="416" rx="40" fill="#002855" filter="url(#drop-shadow)"/>

  <!-- Pantalla principal -->
  <rect x="136" y="88" width="240" height="150" rx="16" fill="#F4F6F9"/>
  
  <!-- Contenido en la Pantalla (Gráficos y Datos) -->
  <rect x="156" y="112" width="120" height="12" rx="4" fill="#002855" opacity="0.8"/>
  <rect x="156" y="132" width="80" height="10" rx="3" fill="#002855" opacity="0.4"/>
  
  <!-- Checkmark / Éxito en pantalla (Verde de confirmación) -->
  <circle cx="330" cy="130" r="18" fill="#10B981"/>
  <path d="M322 130 L328 136 L338 124" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Tarjeta de crédito deslizándose/NFC (Rojo Farmatodo) -->
  <rect x="156" y="168" width="200" height="48" rx="8" fill="#E30613"/>
  <rect x="172" y="180" width="32" height="24" rx="4" fill="#FFC72C"/> <!-- Chip dorado -->
  <line x1="220" y1="186" x2="336" y2="186" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="220" y1="198" x2="290" y2="198" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Ranura / Slot para tarjetas o Papel -->
  <rect x="136" y="260" width="240" height="8" rx="4" fill="#001833"/>

  <!-- Teclado Numérico (Grid de Botones) -->
  <!-- Fila 1 -->
  <rect x="144" y="288" width="60" height="32" rx="8" fill="#1E40AF" opacity="0.4"/>
  <rect x="226" y="288" width="60" height="32" rx="8" fill="#1E40AF" opacity="0.4"/>
  <rect x="308" y="288" width="60" height="32" rx="8" fill="#1E40AF" opacity="0.4"/>

  <!-- Fila 2 -->
  <rect x="144" y="332" width="60" height="32" rx="8" fill="#1E40AF" opacity="0.4"/>
  <rect x="226" y="332" width="60" height="32" rx="8" fill="#1E40AF" opacity="0.4"/>
  <rect x="308" y="332" width="60" height="32" rx="8" fill="#1E40AF" opacity="0.4"/>

  <!-- Fila 3 -->
  <rect x="144" y="376" width="60" height="32" rx="8" fill="#1E40AF" opacity="0.4"/>
  <rect x="226" y="376" width="60" height="32" rx="8" fill="#1E40AF" opacity="0.4"/>
  <rect x="308" y="376" width="60" height="32" rx="8" fill="#1E40AF" opacity="0.4"/>

  <!-- Botones de Acción Especiales (Cancelar / Borrar / Entrar) -->
  <rect x="144" y="420" width="60" height="24" rx="6" fill="#EF4444"/> <!-- Cancelar -->
  <rect x="226" y="420" width="60" height="24" rx="6" fill="#F59E0B"/> <!-- Borrar -->
  <rect x="308" y="420" width="60" height="24" rx="6" fill="#10B981"/> <!-- Enter -->
</svg>
